<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Backup Method: Redirects after 0 seconds if JavaScript is disabled -->
    <meta http-equiv="refresh" content="0; url=https://laughschool.web.app">
</head>
<body>

    <!-- Primary Method: Instant redirect via JavaScript -->
    <script>
        window.location.href = "https://laughchool.web.app";
    </script>

    <!-- Fallback text for visitors in case both methods fail -->
    <p>If you are not redirected automatically, follow this <a href="https://laughchool.web.app">link to Laugh School</a>.</p>
    
</body>
</html>
